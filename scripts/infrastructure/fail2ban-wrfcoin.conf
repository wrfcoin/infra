
# Fail2Ban configuration for Wrfcoin
[Definition]
failregex = <HOST> - - .*"(GET|POST).*" (4|5)\d\d
ignoreregex = 

[wrfcoin-api]
enabled = true
port = 3000,4000,5000
filter = wrfcoin
logpath = /var/log/nginx/access.log
maxretry = 5
bantime = 600
findtime = 300

[wrfcoin-wallet]
enabled = true
port = 4000
filter = wrfcoin
logpath = /var/log/nginx/access.log
maxretry = 3
bantime = 1800
findtime = 300
