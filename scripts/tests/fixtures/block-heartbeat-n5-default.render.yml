# GOLDEN FIXTURE (infra#1327): the default N5 `block-heartbeat` service as rendered by
# scripts/tests/test-block-heartbeat-compose.sh under its fixed dummy env, generated from the
# overlay as it was BEFORE the rotation PR (merge-base ac481c069). The test FAILS on any difference.
# Body below is JSON (valid YAML); '#' lines are ignored by the test.
# Regenerate: BASELINE_OVERLAY=<path to the intended overlay file> bash scripts/tests/test-block-heartbeat-compose.sh > body
#   then keep this header and replace the body.
# WARNING: any change to this fixture means EVERY deployed N5 heartbeat is recreated on its next
