# do not change it without owner sign-off.
{
  "profiles": [
    "block-heartbeat-n5"
  ],
  "cap_drop": [
    "ALL"
  ],
  "command": [
    "node",
    "/app/heartbeat.cjs"
  ],
  "depends_on": {
    "wrfcoin-node": {
      "condition": "service_healthy",
      "required": true
    }
  },
  "deploy": {
    "resources": {
      "limits": {
        "cpus": 0.25,
        "memory": "67108864"
      }
    },
    "placement": {}
  },
  "entrypoint": null,
  "environment": {
    "BLOCK_HEARTBEAT_INTERVAL_SECONDS": "77",
    "WRFCOIN_API_HOST": "wrfcoin-node",
    "WRFCOIN_API_PORT": "8556",
    "WRFCOIN_CHAIN_ID": "777",
    "WRFCOIN_MINER_ADDRESS": "0x680d51f7543ca70029866956376306d47ce60ed0",
    "WRFCOIN_NETWORK_ID": "testnet",
    "WRFCOIN_OPERATOR_TOKEN": "render-only-operator"
