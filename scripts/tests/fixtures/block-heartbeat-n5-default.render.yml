  ],
  "tmpfs": [
    "/tmp:noexec,nosuid,size=1m"
  ],
  "volumes": [
    {
      "type": "bind",
      "source": "/path/to/wrfcoin-deploy/infra/testnet/services/block-heartbeat",
      "target": "/app",
      "read_only": true,
      "bind": {}
    }
  ],
  "working_dir": "/app"
