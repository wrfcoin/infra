permissions:
  contents: read

# The node image is infra's own shipped one (infra/docker/Dockerfile.core): the
# release binary built with the `hsm` feature, plus SoftHSM2. The scenario signs
# blocks through that HSM path with throwaway tokens; it never swaps the binary.

name: P2P Partition Gate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  # Hosted runner + contents: read only, so a PR trigger is safe; scoped to the
  # scenario files since the job builds the node image.
  pull_request:
    paths:
      - ".github/workflows/p2p-partition-gate.yml"
      - "scripts/run-p2p-partition-ci.sh"
      - "infra/docker/Dockerfile.core"

jobs:
  p2p-partition:
    name: P2P Partition Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout infra
        uses: actions/checkout@v7
        with:
          path: wrfcoin/infra

      - name: Checkout core4
        uses: actions/checkout@v7
        with:
          repository: wrfcoin/core4
          path: wrfcoin/core4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build wrfcoin-node image
        uses: docker/build-push-action@v7
        with:
          context: wrfcoin
          file: wrfcoin/infra/infra/docker/Dockerfile.core
          push: false
          load: true
          tags: wrfcoin/wrfcoin-node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run partition and heal (linear catch-up)
        env:
          REPORT_DIR: artifacts/p2p-partition
          P2P_PARTITION_IMAGE: wrfcoin/wrfcoin-node:latest
          P2P_PARTITION_SCENARIO: linear
          WRFCOIN_OPERATOR_TOKEN: ci-test-token
        run: |
          set -o pipefail
          mkdir -p artifacts/p2p-partition
          bash wrfcoin/infra/scripts/run-p2p-partition-ci.sh | tee artifacts/p2p-partition/workflow-output.txt

      # Known gap, kept visible on purpose: a follower on the losing side of a
      # divergent fork does not re-converge. Non-blocking so it cannot gate
      # unrelated work, but it is not hidden: it runs every time and says so.
      - name: Fork re-convergence (known gap, non-blocking)
        continue-on-error: true
        env:
          REPORT_DIR: artifacts/p2p-partition-fork
          P2P_PARTITION_IMAGE: wrfcoin/wrfcoin-node:latest
          P2P_PARTITION_SCENARIO: fork
          WRFCOIN_OPERATOR_TOKEN: ci-test-token
        run: |
          set -o pipefail
          mkdir -p artifacts/p2p-partition-fork
          if bash wrfcoin/infra/scripts/run-p2p-partition-ci.sh | tee artifacts/p2p-partition-fork/workflow-output.txt; then
            echo "::notice title=Fork re-convergence passed::The known fork re-convergence gap may be fixed; the both-sides fork scenario converged."
            echo "### Fork re-convergence: PASSED (known gap appears closed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=KNOWN RED: fork re-convergence::After a both-sides fork heals, the follower on the losing side does not re-converge (non-blocking, tracked privately)."
            echo "### Fork re-convergence: KNOWN RED (non-blocking, tracked privately)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publish partition summary
        if: always()
        run: |
          for f in artifacts/p2p-partition/summary.md artifacts/p2p-partition-fork/summary.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload partition artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2p-partition
          path: artifacts/
