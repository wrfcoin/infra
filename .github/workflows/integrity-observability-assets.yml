permissions:
  contents: read

name: Integrity Observability Assets

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate observability dashboard/alerts/runbook links
        run: node scripts/validate-alignment-integrity-observability.cjs
