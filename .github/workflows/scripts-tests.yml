permissions:
  contents: read

name: Scripts Tests

# Executes the test suites under scripts/ (infra#794).
#
# Before this file, nothing ran them. infra#793 changed scripts/node-dashboard.py
# only and its entire check set was Alignment Impact Check (SUCCESS, irrelevant),
# dependabot-coverage (SUCCESS, irrelevant) and Release Alignment-95 Gate
# (SKIPPED). Nothing executed scripts/tests/test_node_dashboard.py. A green tick
# from zero relevant steps is VOID evidence that is indistinguishable from a real
# pass in the GitHub UI.
#
# Owner-approved 2026-10-07: the required context belongs to the always()
# terminal. Complete local-Git docs classification may exclude the worker;
# every selected worker must succeed. No continue-on-error or workflow paths.
# Explicit reviewed public suites run here; private-input suites stay in the
# separately guarded main/manual workflow. Unknown new suites fail inventory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Refs infra#1113: superseded PRs share a group; every other run is isolated,
# including pending main/dispatch/schedule jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Infra complete-diff scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Complete merge-base to head classification
        id: scope
        run: python3 scripts/docs_ci_gate.py classify

  scripts-tests-worker:
    name: scripts/tests worker
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install 'pytest==7.4.4' 'PyYAML==6.0.1'

      - name: Install pinned Compose renderer
        # The hosted image carries2.38.2: raw nested binds and false/default
        # mount fields differ from the renderer used by these unchanged suites.
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$HOME/.docker"
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          plugin="$DOCKER_CONFIG/cli-plugins/docker-compose"
          curl --fail --silent --show-error --location --max-time 180 \
            https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-x86_64 -o "$plugin"
          printf '%s  %s\n' 33b208d7e76639db742fae84b966cc01dacae58ca3fc4dabbc907045aefdf0c4 "$plugin" | sha256sum -c -
          chmod 700 "$plugin"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          test "$(docker compose version --short)" = 5.1.4
          docker compose version

      - name: Prepare offline Prometheus evaluator
        # test-post33000-alerts.sh only executes this pinned cached image,
        # network-none and read-only. No absent-image exit77 as hosted coverage.
        run: docker pull prom/prometheus:v3.1.0

      - name: Check reviewed suite inventory
        run: python3 scripts/ci-suites.py check

      - name: Python suites (pytest)
        run: python3 scripts/ci-suites.py run --profile hosted --kind python

      - name: Public build freshness fixture
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_public_build_freshness.sh

      - name: Oracle sanity auth fixture
        # infra#1036. Offline: docker/curl are PATH stubs; no live host is contacted.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_oracle_auth.sh

      - name: Snapshot trusted-signer env fixture
        # infra#979 / infra#1080. Until 2026-09-27 nothing ran this suite. It
        # covers WARN-until-pinned / ERROR-once-pinned in check-env-completeness,
        # the compose passthrough render (needs Docker Compose; build runner has v2),
        # and join-script propagation from a synthetic cut-pins fixture.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_snapshot_signers_env.sh

      - name: Genesis faucet cut pin
        # core4#3361 option B. check-env-completeness --cut refuses a testnet
        # cut with no/malformed/mismatched/unforwarded genesis faucet address;
        # without --cut it only WARNs. Offline, synthetic fixtures only.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_genesis_faucet_pin.sh

      - name: Cut-pins overlay renderer
        # testnet/scripts/render-cut-overlay.sh writes docker-compose.cut.yml
        # (genesis hash + core4#3361 genesis faucet address) onto wrfcoin-node.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_render_cut_overlay.sh

      - name: Snapshot-signer attestation record
        # infra#1080 ceremony C4. Offline (openssl only): the committed YubiKey
        # 9C attestation chains to Yubico Attestation Root 1, and its ED25519
        # key equals the WRFCOIN_CUT_SNAPSHOT_TRUSTED_SIGNERS pin. RED controls:
        # a tampered cert, a chain without F9, and a different pin must fail.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_snapshot_signer_attestation.sh

      - name: Runtime image gate fixture
        # testnet/scripts/validate-runtime-image.sh: immutable image-ID pins,
        # running drift, and the seed-profile-aware default container set
        # (infra#1057 Q4, seed retired). Offline: docker is a PATH stub.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_validate_runtime_image.sh

      - name: P2P advertised-address config fixture
        # testnet/tests/test_p2p_external_addr_config.sh: the node's render-time
        # `:?` guard, the seed's RUNTIME guard (rendered entrypoint executed),
        # and check-compose-render-inventory.py with its RED/GREEN controls.
        # Nothing ran it before, and it had rotted twice. Needs Docker Compose
        # for `config` renders only (no daemon); build runner has v2.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_p2p_external_addr_config.sh

      - name: Semantic health fixture
        # infra#1106. testnet/tests/test_semantic_health.sh (HTTP 200 with a
        # degraded/down payload must be RED in the container and promotion gates)
        # exited 1 silently on a clean checkout and no workflow ran it. Offline:
        # a local loopback server; needs python3 + yaml and Docker Compose only
        # to read the compose file (no daemon).
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_semantic_health.sh

      - name: Onboarding env warnings
        # Invitee-onboarding dry run: check-env-completeness WARNs (never fails) when
        # STATION_CHAIN_SYNC_ENABLED, WRFCOIN_READER_TOKEN or WRFCOIN_GOVERNANCE_* are
        # empty, naming what invitees would see. Offline fixtures only.
        if: ${{ !cancelled() }}
        run: bash testnet/tests/test_onboarding_env_warns.sh

      - name: Shell suites (explicit public list)
        # Retain independent execution after pytest failure. Any suite failure
        # still fails this worker and the independent always() terminal.
        if: ${{ !cancelled() }}
        env:
          ESBUILD_ENTRY_FIXTURE: scripts/tests/fixtures/esbuild-entries/backend-tree.txt
        run: python3 scripts/ci-suites.py run --profile hosted --kind shell

  scripts-tests:
    name: scripts/tests suites
    if: always()
    needs: [changes, scripts-tests-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independently verify scope and all results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/docs_ci_gate.py terminal
