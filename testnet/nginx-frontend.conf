# WRFCoin Frontend Dashboard — nginx configuration
# Serves the React SPA and proxies /api/ requests to the backend.

client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # SPA routing — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        client_max_body_size 10m;
        proxy_pass http://wrfcoin-backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # WebSocket proxy (dedicated /ws and /api/ws paths)
    location /ws {
        proxy_pass http://wrfcoin-backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ws {
        proxy_pass http://wrfcoin-backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check for Docker healthcheck
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Security headers
    #
    # Content-Security-Policy is intentionally restrictive for testnet launch
    # (infra#548). It is scoped to exactly the origins the SPA uses:
    #   - script-src 'self'        : all JS is Vite-bundled same-origin; index.html
    #                                has no inline <script>, so NO 'unsafe-inline'.
    #   - style-src                : critical CSS lives inline in index.html and
    #                                MUI/emotion inject runtime inline styles, so
    #                                'unsafe-inline' is required for STYLES ONLY
    #                                (documented exception). Bootstrap CSS and fonts
    #                                are vendored and loaded from same-origin assets.
    #   - font-src                 : same-origin web fonts + inlined data:.
    #   - img-src 'self' data: blob: https://tile.openstreetmap.org :
    #                                favicons/icons + Vite-inlined data URIs +
    #                                blob: for canvas/object URLs, plus the /map
    #                                basemap tiles (frontend config/mapTiles.ts
    #                                default). EXACTLY that one origin, https only
    #                                (owner ruling 2026-09-27, Stage 1.5): no
    #                                wildcard, no subdomains, no `https:`. Viewers'
    #                                IPs reach OSM for tiles only; connect-src and
    #                                every other directive stay 'self'. A changed
    #                                VITE_MAP_TILE_URL needs its own CSP review.
    #   - connect-src 'self'       : /api, /ws and /api/ws are all same-origin via
    #                                the nginx proxy above — no cross-origin XHR/WS.
    #   - frame-ancestors 'none'   : clickjacking protection (pairs with X-Frame-Options).
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Cache static assets
    # Security headers are repeated here because nginx's add_header inheritance
    # rule only applies when a child block has NO add_header of its own.
    # Since this block sets Cache-Control, the parent server-block headers are
    # NOT inherited — they must be listed explicitly. Keep this CSP byte-for-byte
    # in sync with the server-level CSP above.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
