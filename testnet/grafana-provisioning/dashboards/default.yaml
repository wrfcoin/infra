# Auto-load dashboard JSON files from the mounted volume.
apiVersion: 1

providers:
  - name: WRFCoin Testnet
    orgId: 1
    folder: WRFCoin
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
