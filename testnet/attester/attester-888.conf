# WRFCoin chain 888 attester settings: the house reference settings, public and versioned.
# Served (when the owner turns the edge rule on) at GET https://wrfcoin.com/api/attester/settings
# (testnet/edge/public_onboarding.caddy @public_attester_settings, ATTESTER_SETTINGS_PUBLIC=on).
# Format: one KEY=VALUE per line, '#' comments, no quoting, no secrets. Read by the attester seat kit
# and the node launcher; a newer WRFCOIN_ATTESTER_SETTINGS_VERSION replaces an older local copy.
# Raise the version on ANY change below. Changelog: testnet/attester/README.md.
WRFCOIN_ATTESTER_SETTINGS_VERSION=1
WRFCOIN_ATTESTER_CHAIN_ID=888
WRFCOIN_ATTESTER_REFERENCE_MODE=shadow
WRFCOIN_ATTESTER_MAX_REFERENCE_KM=10
WRFCOIN_ATTESTER_POLL_SECS=5
WRFCOIN_ATTESTER_MAX_AGE_SECS=3600
WRFCOIN_ATTESTER_MAX_FUTURE_SKEW_SECS=300
WRFCOIN_ATTESTER_REFERENCE_MAX_PAIR_SECS=1800
# Per site, not shared: WRFCOIN_ATTESTER_NWS_STATION (the reference station nearest the attester) and
# WRFCOIN_ATTESTER_DEM_ELEVATIONS_FILE (a local path; read only while reference_sea_level_pressure is
# active, which is not scheduled on 888).
