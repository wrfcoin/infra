# Explicit overlay plus opt-in profile; main stack stays independent of this simulator.
services:
  wrfcoin-defi:
    profiles: [defi]
    image: wrfcoin/defi-node:testnet-simulator-1e6a20d216a0
    pull_policy: never
    build:
      context: ./services/defi
      args:
        DEFI_REVISION: 1e6a20d216a013e2f6b4029d773705cf54a02624
      network: none
    environment:
      DEFI_NODE_BIND: 0.0.0.0:7100
      DEFI_NODE_POOLS: /etc/defi-node/pools.toml
      RUST_LOG: info
    networks:
      wrfcoin-testnet: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, /usr/local/bin/defi-healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  wrfcoin-backend:
    environment:
      # Existing relay remains unavailable unless the owner supplies this target.
      DEFI_NODE_URL: ${DEFI_NODE_URL:-}
    depends_on:
      wrfcoin-defi:
        condition: service_healthy
        required: false
