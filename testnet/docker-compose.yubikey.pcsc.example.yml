# Public opt-in example. Read PUBLIC_DEPLOYMENT_EXAMPLES.md before use.
# Installation-specific paths must be supplied explicitly.

services:
  wrfcoin-node:
    security_opt: !reset []
    cap_add:
      - SETUID
      - SETGID
    environment:
      WRFCOIN_HSM_MODE: yubikey
      WRFCOIN_HSM_MODULE_PATH: /usr/lib/x86_64-linux-gnu/libykcs11.so
      WRFCOIN_HSM_TOKEN_LABEL: ${WRFCOIN_HSM_TOKEN_LABEL:?WRFCOIN_HSM_TOKEN_LABEL must be set for YubiKey mode}
      WRFCOIN_HSM_KEY_LABEL: ${WRFCOIN_HSM_KEY_LABEL:-Private key for Digital Signature}
      WRFCOIN_HSM_PUBKEY_LABEL: ${WRFCOIN_HSM_PUBKEY_LABEL:-Public key for Digital Signature}
      WRFCOIN_HSM_PRODUCER_KEY_LABEL: ${WRFCOIN_HSM_PRODUCER_KEY_LABEL:-Private key for PIV Authentication}
      WRFCOIN_HSM_PRODUCER_PUBKEY_LABEL: ${WRFCOIN_HSM_PRODUCER_PUBKEY_LABEL:-Public key for PIV Authentication}
      WRFCOIN_HSM_PIN_ENV: WRFCOIN_HSM_PIN
      WRFCOIN_HSM_PIN: ${WRFCOIN_HSM_PIN:?WRFCOIN_HSM_PIN must be set for YubiKey mode}
    volumes:
      - ${WRFCOIN_PCSC_SOCKET_DIR:?Set WRFCOIN_PCSC_SOCKET_DIR to the host pcscd directory}:/run/pcscd:ro

  softhsm-seed-init:
    environment:
      WRFCOIN_HSM_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
      WRFCOIN_HSM_TOKEN_LABEL: wrfcoin-validator
      WRFCOIN_HSM_KEY_LABEL: wrfcoin-signing-key
      WRFCOIN_HSM_PIN_ENV: WRFCOIN_SEED_HSM_PIN
      WRFCOIN_SEED_HSM_PIN: ${WRFCOIN_SEED_HSM_PIN:-}

  wrfcoin-seed:
    environment:
      WRFCOIN_HSM_MODULE_PATH: /usr/lib/softhsm/libsofthsm2.so
      WRFCOIN_HSM_TOKEN_LABEL: wrfcoin-validator
      WRFCOIN_HSM_KEY_LABEL: wrfcoin-signing-key
      WRFCOIN_HSM_PIN_ENV: WRFCOIN_SEED_HSM_PIN
      WRFCOIN_SEED_HSM_PIN: ${WRFCOIN_SEED_HSM_PIN:-}
