# WRFCoin Testnet PostgreSQL WAL/PITR settings.
# Mounted into the postgres container as:
#   /etc/postgresql/postgresql.conf
#
# docker-compose.testnet.yml still provides host-specific memory and connection
# tuning via `postgres -c key=value` flags. This file is focused on WAL archive
# and PITR behavior only.

wal_level = replica
archive_mode = on
archive_timeout = 60s
# A segment reaches its final name only by rename, after the copy is on disk, so an
# interrupted copy leaves just the hidden temp file, which the retry overwrites.
# Re-archiving a segment already there succeeds if the bytes match and fails if not.
# Pruning and restore only look at final names.
archive_command = 'd=/var/lib/postgresql/data/backup/wal; mkdir -p "$d" && if [ -e "$d/%f" ]; then cmp "%p" "$d/%f"; else cp "%p" "$d/.%f.tmp" && sync "$d/.%f.tmp" && mv "$d/.%f.tmp" "$d/%f" && sync "$d"; fi'
max_wal_senders = 3
