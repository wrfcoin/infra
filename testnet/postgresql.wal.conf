# WRFCoin Testnet PostgreSQL WAL/PITR settings.
# Mounted into the postgres container as:
#   /etc/postgresql/postgresql.conf
#
# docker-compose.testnet.yml still provides host-specific memory and connection
# tuning via `postgres -c key=value` flags. This file is focused on WAL archive
# and PITR behavior only.

wal_level = replica
archive_mode = on
archive_timeout = 60s
archive_command = 'mkdir -p /var/lib/postgresql/data/backup/wal && test ! -f /var/lib/postgresql/data/backup/wal/%f && cp %p /var/lib/postgresql/data/backup/wal/%f'
max_wal_senders = 3
