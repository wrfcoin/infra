  # Owner-enabled IPFS archive infrastructure. Neither default nor full starts it.
  # Kubo's administrative API has no host port and only the daemon shares its network.
  ipfs-kubo:
    image: ipfs/kubo:v0.24.0
    profiles: ["ipfs-storage"]
