  # =========================================================================
  # Weather Data Collection (optional — start with: docker compose --profile collector up -d)
  # =========================================================================

  weather-collector:
    image: node:20-alpine
    container_name: wrfcoin-testnet-weather-collector
    restart: unless-stopped
    profiles: ["collector"]
    working_dir: /app
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ${CORE4_PATH:-${WRFCOIN_DEPLOY_ROOT:-/path/to/wrfcoin-deploy}/core4}/tests/security:/app/tests/security:ro
      - ${CORE4_PATH:-${WRFCOIN_DEPLOY_ROOT:-/path/to/wrfcoin-deploy}/core4}/tests/utils:/app/tests/utils:ro
      # Commit/reveal state, station watermarks, signing identity, and explicit
      # terminal outcomes must survive collector-only recreation.
      - weather-collector-state:/root/.wrfcoin/collector-state
      # The legacy single-station entrypoint explicitly keeps its watermark at
      # /app/data/last-submitted-ts.txt rather than beside pending-reveals.json.
      # Mount the same dedicated volume there so both actual runtime paths
      # survive recreation without sharing state with another collector.
      - weather-collector-state:/app/data
    environment:
      AMBIENT_WEATHER_APP_KEY: ${AMBIENT_WEATHER_APP_KEY:-}
      AMBIENT_WEATHER_API_KEY: ${AMBIENT_WEATHER_API_KEY:-}
      WRFCOIN_OPERATOR_TOKEN: ${WRFCOIN_OPERATOR_TOKEN:?WRFCOIN_OPERATOR_TOKEN must be set}
      WRFCOIN_API_HOST: wrfcoin-node
      WRFCOIN_API_PORT: "8556"
      # Chain identity uses the node's expression, with a nonempty legacy default.
      # check-env-completeness refuses a host default that disagrees with cut pins.
      #
      # Since #1848 the mempool refuses a ContributionCommit whose CommitPayload
      # lacks a valid `auth_pubkey`/`auth_signature`, and the collector signs that
      # authorization itself. The message is domain-separated, and the collector
      # resolves the domain the same way the Rust signer does: from these two
      # variables, defaulting to `wrfcoin-main`/`mainnet` when unset
      # (`ambient-pipeline.cjs` DEFAULT_CHAIN_ID / DEFAULT_NETWORK_ID).
      #
      # Unset therefore does not disable the signature — it produces a perfectly
      # valid signature over the MAINNET domain, which this chain rejects with
      # `commit sender authorization failed`. Measured 2026-08-06: 12/12 commits
      # rejected with these unset, 12/12 accepted with them set, same station,
      # same keys, same minute. Sibling of core4#2713 and core4#2744.
      WRFCOIN_CHAIN_ID: "${WRFCOIN_CHAIN_ID:-777}"
      WRFCOIN_NETWORK_ID: testnet
      # Contributor address credited for Jon's WS-5000 readings.
      #
      # This is the address that is actually PAID: rewards go to the reveal's
      # first output, not to the station registry's `owner_address` (core4#2743).
      # Registering a station to one address while the collector submits to
      # another looks correct on every surface and pays the wrong account.
      # `PWS-EXAMPLE-WS5000` is registered to this address in block 674.
      JONS_CONTRIBUTOR: ${JONS_CONTRIBUTOR:-0xed36d00b294c5eecdc5e12bdf712d786bd919b08}
      # Station elevation for the sea-level pressure field (wrfcoin/core4#3285).
      #
      # Leave UNSET. The elevation comes from the station's on-chain registration
      # (`location.elevation_meters`, read over WRFCOIN_API_HOST/PORT above via
      # GET /transactions/station/registrations/PWS-EXAMPLE-WS5000). A station
      # with no registered elevation submits no `pressure_sea_level_hpa`: there
      # is no default and no guess. (That lookup ships in the core4 collector
      # change for #3285; a core4 tree without it still falls back to its old
      # built-in 220 m, exactly as before this variable was listed.)
      #
      # Set it only as an explicit operator override. Jon's owner-measured value
      # is 227.7 m (747 ft) ASL; the USGS DEM says 247.9 m there and is wrong, so
      # the registration carries the override. Empty here means "not set".
      # The multi-station collector has no equivalent: every station's elevation
      # comes from its own registration.
      JONS_ELEVATION_M: ${JONS_ELEVATION_M:-}
    entrypoint: /bin/sh
    command: >-
      -c "while true; do node tests/security/fetch-ambient-weather.cjs || true; sleep 300; done"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f fetch-ambient-weather.cjs > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      wrfcoin-node:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - wrfcoin-testnet

  # Multi-contributor ingestion. `weather-collector` above is Jon's WS-5000 and
  # ONLY that — it is hardcoded to his MAC and holds his account's API key, so it
  # structurally cannot see any other contributor's station. Every additional
  # contributor arrives through this service.
  #
  # Roster lives OUTSIDE the compose tree at /root/wrfcoin-secrets, deliberately:
  # it carries live Ambient API keys, and <deploy-root> is a Docker
  # build context that gets uploaded to the daemon on every build. Mounted
  # read-only.
  #
  # `--credentials-file` also routes around backend#1042, where
  # GET /api/weather/stations/credentials returns 500 and the backend roster is
  # therefore unavailable. When that is fixed this flag can go.
  weather-collector-multi:
    image: node:20-alpine
    container_name: wrfcoin-testnet-weather-collector-multi
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles: ["collector"]
    working_dir: /app
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      # Separate from CORE4_PATH on purpose. The deploy tree is pinned to the
      # genesis-cut commit because the node image builds from it, and that pin
      # must not drift. But the multi-tenant collector needs core4#2740 — the
      # provenance-graded model binding — which landed AFTER the cut. Without it
      # a real station is refused with `model_unverified` and skipped, silently
      # earning nothing (measured on Steven's WS-2902D, 2026-08-06).
      #
      # Defaults to the deploy tree, so hosts that are current need no override.
      - ${MULTI_COLLECTOR_CORE4:-${WRFCOIN_DEPLOY_ROOT:-/path/to/wrfcoin-deploy}/core4}/tests/security:/app/tests/security:ro
      - ${MULTI_COLLECTOR_CORE4:-${WRFCOIN_DEPLOY_ROOT:-/path/to/wrfcoin-deploy}/core4}/tests/utils:/app/tests/utils:ro
      - ${WRFCOIN_ROSTER_DIR:-/root/wrfcoin-secrets}:/secrets:ro
      - weather-collector-multi-state:/root/.wrfcoin/collector-state
    environment:
      WRFCOIN_OPERATOR_TOKEN: ${WRFCOIN_OPERATOR_TOKEN:?WRFCOIN_OPERATOR_TOKEN must be set}
      WRFCOIN_API_HOST: wrfcoin-node
      WRFCOIN_API_PORT: "8556"
      # Same reasoning as weather-collector above, and the same measurement:
      # unset does not disable the commit signature, it signs the MAINNET domain
      # and every commit is rejected as "commit sender authorization failed".
      # Measured 2026-08-06: 0/12 accepted without these, 12/12 with them.
      WRFCOIN_CHAIN_ID: "${WRFCOIN_CHAIN_ID:-777}"
      WRFCOIN_NETWORK_ID: testnet
    entrypoint: /bin/sh
    command: >-
      -c "while true; do node tests/security/fetch-ambient-weather-multi.cjs
      --credentials-file /secrets/ambient-roster.json || true; sleep 300; done"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f fetch-ambient-weather-multi.cjs > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      wrfcoin-node:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - wrfcoin-testnet

  # =========================================================================
  # RTL-SDR Weather Enrichment (experimental — start with: docker compose --profile experimental up -d)
  # =========================================================================

  sdr-ingest:
    build:
      context: ..
      dockerfile: testnet/services/sdr-ingest/Dockerfile
      labels: *infra-build-labels
    image: wrfcoin/sdr-ingest:experimental
    container_name: wrfcoin-testnet-sdr-ingest
    restart: unless-stopped
    profiles: ["experimental"]
    environment:
      NODE_ENV: testnet
      WRF_INGEST_URL: http://wrfcoin-backend:4001/ingest
      SDR_POLL_INTERVAL: ${SDR_POLL_INTERVAL:-5}
      SDR_PROTOCOLS: ${SDR_PROTOCOLS:-acurite,oregon,fine_offset}
      SDR_FIXTURE_FILE: ${SDR_FIXTURE_FILE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "9000"
    depends_on:
      wrfcoin-backend:
        condition: service_healthy
    devices:
      # RTL-SDR USB device (adjust vendor:product ID as needed)
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./services/sdr-ingest/fixtures:/app/fixtures:ro
      - sdr-ingest-logs:/app/logs
    networks:
      - wrfcoin-testnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # =========================================================================
  # WRFCoin Frontend Dashboard (React + nginx)
  # =========================================================================

  wrfcoin-frontend:
    image: wrfcoin/frontend:testnet
    container_name: wrfcoin-testnet-frontend
    restart: unless-stopped
    ports:
      # Frontend dashboard — loopback only for the June 17 tailnet launch (#557).
      - "127.0.0.1:5000:5000"
    volumes:
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      wrfcoin-backend:
        condition: service_healthy
    # backend#1229: ONLY on the pinned ingress network, so its address (and the
    # gateway docker-proxy uses for the 127.0.0.1:5000 publish) is fixed and
    # the backend can trust exactly this hop. nginx talks to nothing but the
    # backend, which is also on wrfcoin-ingress.
    networks:
      wrfcoin-ingress:
        ipv4_address: 10.251.0.10
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /var/cache/nginx:noexec,nosuid,size=50m,uid=1001,gid=1001,mode=0755
      - /run:noexec,nosuid,size=10m,uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # =========================================================================
  # Monitoring
  # =========================================================================

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: wrfcoin-testnet-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.testnet.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./alert-rules-blockchain-health.yml:/etc/prometheus/alert-rules-blockchain-health.yml:ro
      - ./alert-rules-backend-down.yml:/etc/prometheus/alert-rules-backend-down.yml:ro
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./prometheus-bearer-token:/etc/prometheus/bearer_token:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.config.file=/etc/prometheus/web.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      # --web.enable-lifecycle REMOVED: exposes unauthenticated POST /-/quit (#186)
    networks:
      - wrfcoin-testnet
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S --spider http://localhost:9090/-/healthy 2>&1 | grep -Eq 'HTTP/.* (200 OK|401 Unauthorized)'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.0
    container_name: wrfcoin-testnet-loki
    restart: unless-stopped
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/config.yaml"
    networks:
      - wrfcoin-testnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /loki/cache:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  promtail:
    image: grafana/promtail:2.9.0
    container_name: wrfcoin-testnet-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/var/lib/promtail
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - wrfcoin-testnet
    healthcheck:
      # grafana/promtail:2.9.0 ships without wget or curl, so probe liveness
      # via PID 1 instead of an HTTP /ready request. Restores container health
      # status after the N5 Pro redeploy that flagged promtail as unhealthy.
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: wrfcoin-testnet-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/node-overview.json
      # Passed through to Grafana provisioning for Prometheus datasource basic auth
      PROMETHEUS_ADMIN_PASSWORD: ${PROMETHEUS_ADMIN_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - wrfcoin-testnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: wrfcoin-testnet-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - wrfcoin-testnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: wrfcoin-testnet-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks:
      - wrfcoin-testnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
        reservations:
          memory: 16M
          cpus: '0.1'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Monitoring helpers for backend alerting, not application services.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: wrfcoin-testnet-cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /proc:/rootfs/proc:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    user: root
    networks:
      - wrfcoin-testnet
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: wrfcoin-testnet-postgres-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://wrfcoin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/wrfcoin?sslmode=disable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    user: "65534:65534"
    networks:
      - wrfcoin-testnet
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: wrfcoin-testnet-blackbox-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9115:9115"
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    user: "65534:65534"
    networks:
      - wrfcoin-testnet
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9115/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # Chain-ops exporter (2026-11-01): node-pay receipt/settlement gauges and
  # chain-rewards index freshness, read-only from this host's node and backend.
  # Alerts: NodePay* and ChainRewardIndex* in alert-rules.yml. Stock python
  # image with the script bind-mounted, so nothing is built on a node host.
  # NODE_PAY_HOUSE_BONDS defaults to chain 888's three house bonds (public
  # deployment ids); set it in .env for any other chain.
  chain-ops-exporter:
    image: python:3.11-slim
    container_name: wrfcoin-testnet-chain-ops-exporter
    restart: unless-stopped
    command: ["python3", "-u", "/app/chain_ops_exporter.py"]
    expose:
      - "9202"
    environment:
      NODE_URL: http://wrfcoin-node:8556
      BACKEND_URL: http://wrfcoin-backend:4001
      NODE_READER_TOKEN_FILE: /run/secrets/node_reader_token
      NODE_PAY_HOUSE_BONDS: ${NODE_PAY_HOUSE_BONDS:-ws=6d4e5c712682934c90f3ee02eddb10bceed8013e1e75b7377cfe92a7ed7df6e6,n5=d5833539f48c33946531e51d058c14e6605125cd95b1ece53a21470788b78aca,mango=fcf37851893d7c49bd2550f339e67619b158330273fd9d32f029e0616c109fff}
      NODE_PAY_EPOCH_BLOCKS: ${NODE_PAY_EPOCH_BLOCKS:-512}
      POLL_INTERVAL_SECS: "60"
      EXPORTER_PORT: "9202"
    volumes:
      - ./services/chain-ops-exporter/chain_ops_exporter.py:/app/chain_ops_exporter.py:ro
      - ./prometheus-bearer-token:/run/secrets/node_reader_token:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    user: "65534:65534"
    networks:
      - wrfcoin-testnet
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9202/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Independent reference data for the oracle trust bootstrap (infra#603).
  # This is intentionally internal-only: core4 consumes it over the compose
  # network, and no host port is published.
  oracle-reference:
    # Opt-in, because its build context is a sibling repo that is not checked
    # out on every operator host. Without this profile the service sits in the
    # DEFAULT set, so a host lacking `../../oracle-reference` cannot start the
    # stack at all: compose aborts the whole `up` preparing the missing context,
    # and with `--no-build` it instead fails creating a container for an image
    # that was never built. Either way twenty-six healthy services fail to start
    # because of one that has never run on that host.
    #
    # Measured on CT 101 during the 2026-08-06 cold-boot outage. Enable with
    # `--profile oracle-reference` on a host that has the repo checked out.
    profiles: ["oracle-reference"]
    build:
      context: ../../oracle-reference
      dockerfile: Dockerfile
      # No infra provenance labels: this image is built from the separate
      # oracle-reference repository, and it is not a gated release image.
    image: wrfcoin/oracle-reference:testnet-local
    container_name: wrfcoin-testnet-oracle-reference
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CACHE_MAX_GB: "10"
      EARTH2STUDIO_CACHE: /data/cache
    volumes:
      - reference-cache:/data/cache
    networks:
      - wrfcoin-testnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

# =============================================================================
# Networks
# =============================================================================

networks:
  ipfs-private:
    driver: bridge
    internal: true
  wrfcoin-testnet:
    driver: bridge
  # backend#1229: dedicated network for the ingress hops (frontend nginx, edge,
  # funnel-edge) and the backend they proxy to. Pinned so the backend's
  # TRUSTED_PROXIES can name exact addresses; wrfcoin-testnet stays dynamic and
  # is not recreated by this change. 10.x is outside Docker's default address
  # pools (172.17-31.0.0/16, 192.168.0.0/16), so it cannot collide with a
  # network Docker allocated on its own.
  wrfcoin-ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 10.251.0.0/24
          gateway: 10.251.0.1

# =============================================================================
# Volumes (named — persisted across restarts)
# =============================================================================

# =============================================================================
# Volume Encryption Notice
#
# These named volumes store sensitive data (blockchain state, PostgreSQL DB,
# Redis sessions). For production/testnet deployments on the N5 Pro, the host
# filesystem backing these volumes MUST be LUKS2-encrypted.
#
# See docs/volume-encryption.md for:
#   - LUKS2 setup and auto-mount on reboot
#   - Per-volume LUKS bind-mount override pattern
#   - Key management rules (never commit keyfiles to git)
#   - HDD secure-erase procedures before RMA/disposal
#   - bootstrap.sh encryption check integration
#
# To use LUKS-backed bind mounts instead of named volumes, create a
# testnet/docker-compose.override.yml pointing to /mnt/wrfcoin-*/data paths.
# =============================================================================

volumes:
  testnet-ipfs-data: {}
  postgres-data: {}
  postgres-backup: {}
  redis-data: {}
  node-data: {}
  ml-data: {}
  seed-data: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
  alertmanager-data: {}
  promtail-positions: {}
  reference-cache: {}
  sdr-ingest-logs: {}
  weather-collector-state: {}
  weather-collector-multi-state: {}
