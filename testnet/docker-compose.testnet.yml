    environment:
      IPFS_PROFILE: server
    volumes:
      - testnet-ipfs-data:/data/ipfs
    networks:
      - ipfs-private
    # Probe the local RPC API, not `ipfs id`: healthchecks exec as root, and
    # with cap_drop ALL root cannot read the daemon-owned 0600 repo config.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --post-data='' http://127.0.0.1:5001/api/v0/id || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
