<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WRFCoin Testnet Explorer</title>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a1f2e;
    --border: #2a3040;
    --text: #e4e8f0;
    --muted: #8892a4;
    --accent: #4a9eff;
    --accent-dim: #2a5a9e;
    --green: #34d399;
    --orange: #f59e0b;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .header-status { font-size: 0.8rem; color: var(--muted); }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 4px;
  }
  .status-dot.offline { background: var(--red); }

  /* Search */
  .search-bar {
    display: flex;
    max-width: 600px;
    margin: 1.5rem auto;
    padding: 0 1rem;
  }
  .search-bar input {
    flex: 1;
    padding: 0.6rem 1rem;
    font-size: 0.9rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: none;
    border-radius: 6px 0 0 6px;
    color: var(--text);
    outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar button {
    padding: 0.6rem 1.2rem;
    font-size: 0.9rem;
    background: var(--accent-dim);
    border: 1px solid var(--accent-dim);
    border-radius: 0 6px 6px 0;
    color: white;
    cursor: pointer;
  }

  /* Overview cards */
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    padding: 0 2rem 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  .card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 1.4rem; font-weight: 700; margin-top: 0.25rem; }

  /* Tables */
  .section {
    max-width: 1200px;
    margin: 0 auto 2rem;
    padding: 0 2rem;
  }
  .section h2 { font-size: 1rem; margin-bottom: 0.75rem; color: var(--muted); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  th, td { padding: 0.6rem 1rem; text-align: left; font-size: 0.85rem; }
  th { background: var(--bg); color: var(--muted); font-weight: 500; }
  tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 0.8rem; }
  .hash { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .badge-weather { background: #1a3a2a; color: var(--green); }
  .badge-transfer { background: #1a2a3a; color: var(--accent); }
  .badge-stake { background: #3a2a1a; color: var(--orange); }
  .badge-other { background: #2a2a2a; color: var(--muted); }

  /* Detail pages */
  .detail {
    max-width: 1200px;
    margin: 1.5rem auto;
    padding: 0 2rem;
  }
  .detail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .detail-header h2 { margin-bottom: 0; }
  .detail h2 { font-size: 1.1rem; margin-bottom: 1rem; }
  .detail-grid {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 0.5rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  .detail-grid .label { color: var(--muted); font-size: 0.85rem; }
  .detail-grid .val { font-size: 0.85rem; word-break: break-all; }

  /* Weather data card */
  .weather-card {
    background: linear-gradient(135deg, #1a2a3a, #1a3a2a);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-top: 1rem;
  }
  .weather-card h3 { font-size: 0.95rem; color: var(--green); margin-bottom: 0.75rem; }
  .weather-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
  }
  .weather-metric .wlabel { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
  .weather-metric .wval { font-size: 1.1rem; font-weight: 600; }

  .loading { text-align: center; padding: 3rem; color: var(--muted); }
  .back-link { display: inline-block; margin-bottom: 1rem; font-size: 0.85rem; }
  .detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .action-button {
    padding: 0.55rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--accent-dim);
    background: var(--accent-dim);
    color: white;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .action-button.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .action-button:hover {
    filter: brightness(1.05);
  }
  .action-note {
    margin-top: 0.75rem;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (max-width: 600px) {
    header { padding: 0.75rem 1rem; }
    .section, .detail { padding: 0 1rem; }
    .overview { padding: 0 1rem 1rem; grid-template-columns: repeat(2, 1fr); }
    .detail-grid { grid-template-columns: 1fr; }
    .detail-header { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1><span>WRF</span>Coin Testnet Explorer</h1>
  <div class="header-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">connecting...</span>
  </div>
</header>

<div class="search-bar">
  <input id="searchInput" type="text" placeholder="Search by block height or transaction hash..." />
  <button id="searchButton" type="button">Search</button>
</div>

<div id="app">
  <div class="loading">Loading...</div>
</div>

<script src="/app.js"></script>
</body>
</html>
