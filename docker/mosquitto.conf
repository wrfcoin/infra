# Mosquitto MQTT Broker Configuration for WRFCoin RTL-433 Integration

# Listener on standard MQTT port
listener 1883
protocol mqtt

# Listener on WebSocket port (for web clients)
listener 9001
protocol websockets

# Anonymous publish and subscribe are disabled for transport trust.
# The compose entrypoint provisions this file from required MQTT_USERNAME and
# MQTT_PASSWORD environment variables before starting the broker.
allow_anonymous false
password_file /mosquitto/auth/passwd.txt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Max connections
max_connections -1

# Message queue settings
max_queued_messages 1000
max_inflight_messages 20

# Topic-specific settings

# RTL-433 data retention (keep last message for 24 hours)
# This allows new subscribers to get the last reading
message_size_limit 0

# Security
# require_certificate false
# use_username_as_clientid false

# Bridge configuration (optional - to connect multiple brokers)
# connection_messages true
# log_dest topic
# log_type all
