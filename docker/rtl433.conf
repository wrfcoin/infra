# RTL-433 Configuration for WRFCoin Weather Station Decoding
#
# This configuration optimizes rtl_433 for reliable weather station data capture.
# Supports multiple RF sensor protocols: Acurite, Ambient Weather, Davis, Netatmo, Fine Offset.
#
# Usage: rtl_433 -c rtl433.conf

# Output format: JSON for easy parsing
output json

# Frequency: 433.05 MHz (ISM band for weather stations in most regions)
frequency 433.05M

# Gain: auto-tune (set to fixed value like "20" for weaker signals)
gain auto

# Sample rate: standard for RTL-SDR
sample_rate 250000

# Hop time: how long to listen on each frequency before hopping (0 = no hop)
hop_time 0

# Device selection (0 = first available RTL-SDR dongle)
device 0

# Protocol specifications: enable only weather-relevant protocols
# This reduces false positives and noise

protocol default:on
protocol acurite:on            # Acurite 606TX, 00986A, etc.
protocol ambient_weather:on    # Ambient Weather WH65, WH80, WH2, etc.
protocol davis:on              # Davis Vantage Pro, Vantage Vue
protocol netatmo:on            # Netatmo weather station
protocol fineoffset:on         # Fine Offset WH1080, WH2400

# Disable protocols not relevant to weather (reduce noise)
protocol prologue:off
protocol ds_dtec:off
protocol elv_em1000:off
protocol waveman:off
protocol steelmate:off
protocol ecowitt:off

# Report settings
report all_fields              # Report all decoded fields
report no_empty_fields         # Skip empty/null fields
report consolidate             # Consolidate repeated messages

# Data settings
data_limit 0                   # No limit on data points (0 = unlimited)
new_model_status on            # Show model detection status
duration 0                     # Run indefinitely (0 = no timeout)

# Verbose output (set to 0 for quiet operation in production)
verbose 0

# JSON-specific output configuration
json_validate                  # Validate JSON before output
json_prettify                  # Pretty-print JSON (optional, removes for performance)

# Retry settings for unreliable signals
new_model_count 1              # Number of good reads required before reporting
new_model_retries 3            # Retry on checksum errors

# For MQTT bridging (if using rtl_433 with MQTT plugin)
# mqtt_host localhost
# mqtt_port 1883
# mqtt_user (optional)
# mqtt_pass (optional)
# mqtt_topic_suffix home/rtl_433
