version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wrfcoin-wrf-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9096:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # SECURITY: --web.enable-lifecycle removed (unauth /-/reload and /-/quit endpoints)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1.0
    container_name: wrfcoin-wrf-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - '127.0.0.1:3006:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/wrf:ro

volumes:
  grafana_data:
  prometheus_data:
