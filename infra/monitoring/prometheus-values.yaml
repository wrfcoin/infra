# Prometheus Operator Configuration for Wrfcoin
# Optimized for blockchain and weather data monitoring

fullnameOverride: 'prometheus-operator'

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

global:
  rbac:
    create: true

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 2
    retention: 30d
    retentionSize: '50GB'

    # Resource allocation for blockchain monitoring
    resources:
      requests:
        memory: '4Gi'
        cpu: '2000m'
      limits:
        memory: '8Gi'
        cpu: '4000m'

    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi

    # Scrape configuration for Wrfcoin services
    additionalScrapeConfigs:
      - job_name: 'wrfcoin-blockchain'
        static_configs:
          - targets: ['wrfcoin-api:3001']
        scrape_interval: 15s
        metrics_path: '/metrics'

      - job_name: 'wrfcoin-weather'
        static_configs:
          - targets: ['wrfcoin-weather:5006']
        scrape_interval: 30s
        metrics_path: '/metrics'

      - job_name: 'wrfcoin-cross-chain'
        static_configs:
          - targets: ['wrfcoin-cross-chain:3000']
        scrape_interval: 30s
        metrics_path: '/metrics'

      - job_name: 'wrfcoin-iot'
        static_configs:
          - targets: ['wrfcoin-iot:5006']
        scrape_interval: 30s
        metrics_path: '/metrics'

    # Service discovery for dynamic targets
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    # External labels for multi-cluster setup
    externalLabels:
      cluster: wrfcoin-production
      region: us-east-1

grafana:
  enabled: true

  # Admin credentials (password set via Terraform)
  admin:
    existingSecret: ''
    userKey: admin-user
    passwordKey: admin-password

  # Resource allocation
  resources:
    requests:
      memory: '512Mi'
      cpu: '500m'
    limits:
      memory: '1Gi'
      cpu: '1000m'

  # Persistence
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  # Grafana configuration
  grafana.ini:
    server:
      root_url: '%(protocol)s://%(domain)s/grafana/'
      serve_from_sub_path: true

    analytics:
      reporting_enabled: false
      check_for_updates: false

    security:
      allow_embedding: true
      cookie_secure: true
      cookie_samesite: strict

    auth:
      disable_login_form: false
      disable_signout_menu: false

    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

  # Default datasources
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-operator-kube-p-prometheus:9090
          access: proxy
          isDefault: true
          editable: true

        - name: Jaeger
          type: jaeger
          url: http://jaeger-query.tracing.svc.cluster.local:16686
          access: proxy
          editable: true

  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'wrfcoin-dashboards'
          orgId: 1
          folder: 'Wrfcoin'
          type: file
          disableDeletion: false
          editable: true
          updateIntervalSeconds: 10
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/wrfcoin

  # Custom dashboards
  dashboards:
    wrfcoin-dashboards:
      blockchain-overview:
        gnetId: 15757 # Blockchain metrics dashboard
        revision: 1
        datasource: Prometheus

      kubernetes-cluster:
        gnetId: 7249 # Kubernetes cluster monitoring
        revision: 1
        datasource: Prometheus

      node-exporter:
        gnetId: 1860 # Node Exporter full
        revision: 27
        datasource: Prometheus

  # Ingress configuration (optional)
  ingress:
    enabled: false

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 2

    # Pre-create this Secret in the monitoring namespace with key `password`.
    # The operator mounts it at /etc/alertmanager/secrets/<secret-name>/.
    secrets:
      - wrfcoin-alertmanager-smtp

    # Resource allocation
    resources:
      requests:
        memory: '256Mi'
        cpu: '100m'
      limits:
        memory: '512Mi'
        cpu: '500m'

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    # Alertmanager configuration
    config:
      global:
        smtp_smarthost: 'localhost:587'
        smtp_from: 'alertmanager@wrfcoin.com'
        smtp_auth_username: 'alertmanager@wrfcoin.com'
        smtp_auth_password_file: '/etc/alertmanager/secrets/wrfcoin-alertmanager-smtp/password'

      route:
        group_by: ['alertname', 'cluster', 'service']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 1h
        receiver: 'web.hook'
        routes:
          - match:
              severity: critical
            receiver: 'critical-alerts'
            group_wait: 5s
            repeat_interval: 5m

          - match:
              severity: warning
            receiver: 'warning-alerts'
            repeat_interval: 30m

      receivers:
        - name: 'web.hook'
          webhook_configs:
            - url: 'http://127.0.0.1:5001/'

        - name: 'critical-alerts'
          email_configs:
            - to: 'critical-alerts@wrfcoin.com'
              subject: 'CRITICAL: {{ .GroupLabels.alertname }}'
              body: |
                {{ range .Alerts }}
                Alert: {{ .Annotations.summary }}
                Description: {{ .Annotations.description }}
                {{ end }}
          slack_configs:
            - api_url: 'YOUR_SLACK_WEBHOOK_URL'
              channel: '#critical-alerts'
              title: 'CRITICAL Alert'
              text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

        - name: 'warning-alerts'
          email_configs:
            - to: 'warnings@wrfcoin.com'
              subject: 'WARNING: {{ .GroupLabels.alertname }}'
              body: |
                {{ range .Alerts }}
                Alert: {{ .Annotations.summary }}
                Description: {{ .Annotations.description }}
                {{ end }}

nodeExporter:
  enabled: true

  # Resource allocation
  resources:
    requests:
      memory: '64Mi'
      cpu: '50m'
    limits:
      memory: '128Mi'
      cpu: '200m'

kubeStateMetrics:
  enabled: true

  # Resource allocation
  resources:
    requests:
      memory: '64Mi'
      cpu: '50m'
    limits:
      memory: '128Mi'
      cpu: '200m'

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeControllerManager:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true

kubeEtcd:
  enabled: true
