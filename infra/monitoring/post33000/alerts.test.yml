  - series: wrfcoin_blockchain_block_height{job="post33000-ws",instance="ws"}
    values: 33001+1x40
  - series: wrfcoin_blockchain_block_height{job="post33000-mango",instance="mango"}
    values: 33001+1x40
  - series: wrfcoin_blockchain_block_height{job="post33000-n5",instance="n5"}
    values: 33001+1x40
  - series: up{job="post33000-ws",instance="ws"}
    values: 1+0x40
  - series: up{job="post33000-mango",instance="mango"}
    values: 1+0x40
  - series: up{job="post33000-n5",instance="n5"}
    values: 1+0x40
  - series: up{job="post33000-faucet",instance="faucet"}
    values: 1+0x40
  - series: wrfcoin_faucet_wallet_balance{job="post33000-faucet",instance="faucet"}
    values: 100+0x40
  - series: wrfcoin_faucet_wallet_balance_scrape_success{job="post33000-faucet",instance="faucet"}
    values: 1+0x40
  alert_rule_test:
  - eval_time: 30m
    alertname: FaucetNetFundingStalled
    exp_alerts:
    - exp_labels:
        severity: warning
        component: faucet-funding
        job: post33000-faucet
        instance: faucet
      exp_annotations: &id001
        summary: Faucet net balance did not increase while all three tips advanced at least20 blocks
        description: After owner-verified E0f, inspect funding versus claim outflow; this is net balance, not minted emissions.
  - eval_time: 30m
    alertname: ThreeNodeTipsDiverged
    exp_alerts: []
  - eval_time: 30m
    alertname: Post33000ObservationUnavailable
    exp_alerts: []
