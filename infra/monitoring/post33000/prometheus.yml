# OWNER must review the four existing tunnel mappings before opting in.
# Reserved example local ports deliberately carry no deployed-target claim.
global:
  scrape_interval: 90s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: post33000-ws
    bearer_token_file: /run/secrets/reader-token
    static_configs:
      - targets: ['127.0.0.1:19001']
  - job_name: post33000-mango
    bearer_token_file: /run/secrets/reader-token
    static_configs:
      - targets: ['127.0.0.1:19002']
  - job_name: post33000-n5
    bearer_token_file: /run/secrets/reader-token
    static_configs:
      - targets: ['127.0.0.1:19003']
  - job_name: post33000-faucet
    bearer_token_file: /run/secrets/reader-token
    static_configs:
      - targets: ['127.0.0.1:19004']
