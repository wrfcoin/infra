# Complete Wrfcoin Monitoring Infrastructure
# Includes Prometheus, Grafana, Jaeger, Tempo, AlertManager, and supporting services

version: '3.8'

networks:
  monitoring:
    driver: bridge
  tracing:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  jaeger_data:
  tempo_data:
  loki_data:

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: wrfcoin-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      # SECURITY: --web.enable-lifecycle and --web.enable-admin-api removed
      # These expose unauthenticated /-/reload, /-/quit, and admin TSDB endpoints.
      - '--web.external-url=http://localhost:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/:/etc/prometheus/alerts/:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - tracing
    depends_on:
      - alertmanager

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: wrfcoin-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource,grafana-worldmap-panel,grafana-piechart-panel,grafana-clock-panel
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,correlations
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=info
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/:ro
    networks:
      - monitoring
      - tracing
    depends_on:
      - prometheus
      - jaeger
      - tempo

  # AlertManager - Alert routing and notification
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: wrfcoin-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--web.route-prefix=/'
      - '--cluster.listen-address=0.0.0.0:9094'
    volumes:
      - ./alertmanager-enhanced.yml:/etc/alertmanager/config.yml:ro
      - ./alertmanager/templates/:/etc/alertmanager/templates/:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    environment:
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}

  # Jaeger - Distributed tracing (all-in-one for development)
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: wrfcoin-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
      - "14250:14250"  # Jaeger collector gRPC
      - "6831:6831/udp"  # Jaeger agent compact thrift
      - "6832:6832/udp"  # Jaeger agent binary thrift
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger
    networks:
      - tracing
      - monitoring

  # Tempo - Alternative tracing backend
  tempo:
    image: grafana/tempo:2.2.0
    container_name: wrfcoin-tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    command:
      - '-config.file=/etc/tempo.yaml'
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - tracing
      - monitoring

  # OpenTelemetry Collector - Trace collection and processing
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.85.0
    container_name: wrfcoin-otel-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "127.0.0.1:8889:8889"   # Prometheus metrics
      - "127.0.0.1:13133:13133" # Health check
    command:
      - '--config=/etc/otelcol-contrib/otel-collector-config.yaml'
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    networks:
      - tracing
      - monitoring
    depends_on:
      - jaeger
      - tempo
      - prometheus

  # Loki - Log aggregation (optional for log correlation)
  loki:
    image: grafana/loki:2.9.0
    container_name: wrfcoin-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - monitoring

  # Promtail - Log collection for Loki
  promtail:
    image: grafana/promtail:2.9.0
    container_name: wrfcoin-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # Redis - For caching and session storage (with monitoring)
  redis:
    image: redis:7.2-alpine
    container_name: wrfcoin-redis
    restart: unless-stopped
    # SECURITY: Remove public port exposure - Redis should only be accessible internally
    # ports:
    #   - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - monitoring

  # Redis Exporter - Metrics for Redis
  redis-exporter:
    image: oliver006/redis_exporter:v1.54.0
    container_name: wrfcoin-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    networks:
      - monitoring
    depends_on:
      - redis

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: wrfcoin-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: wrfcoin-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  # Blackbox Exporter - External endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: wrfcoin-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox-config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring

  # Custom Webhook Receiver for Alerts
  webhook-receiver:
    build:
      context: ./webhook-receiver/
      dockerfile: Dockerfile
    container_name: wrfcoin-webhook-receiver
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET required}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  redis_data:
