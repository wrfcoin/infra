global:
  # SMTP Configuration for Email Alerts
  # AlertManager does not perform ${VAR} substitution; values are hardcoded here.
  # Operators who need custom SMTP settings should override via a local config mount.
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@wrfcoin.com'
  smtp_auth_username: ''
  # SECURITY: password read from mounted secret file, NOT an env var
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

  # SECURITY: Slack webhook URL read from mounted secret file, NOT an env var
  slack_api_url_file: /run/secrets/slack_webhook

  # Default resolve timeout
  resolve_timeout: 5m

# Alert routing configuration
route:
  # Default receiver for all alerts
  receiver: 'slack-critical'

  # Group alerts by alertname and severity
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Routing rules based on severity
  routes:
    # Critical alerts - send to both Slack and Email
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      continue: false

    # High severity alerts - Slack with faster intervals
    - match:
        severity: high
      receiver: 'slack-critical'
      group_wait: 20s
      group_interval: 2m
      repeat_interval: 2h
      continue: false

    # Warning alerts - Slack warnings channel
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h
      continue: false

    # Info/low priority alerts - Email only
    - match:
        severity: info
      receiver: 'email-alerts'
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h
      continue: false

    # Security-related alerts - immediate notification
    - match_re:
        alertname: '.*(Security|Auth|Intrusion|Breach).*'
      receiver: 'security-alerts'
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 30m
      continue: false

    # Database alerts
    - match:
        service: database
      receiver: 'slack-infrastructure'
      continue: false

    # Blockchain/bridge alerts
    - match_re:
        service: '(blockchain|bridge|cross-chain)'
      receiver: 'slack-critical'
      continue: false

    # Cache alerts
    - match:
        service: cache
      receiver: 'slack-infrastructure'
      continue: false

# Receivers Configuration
receivers:
  # Critical alerts - both Slack and Email
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#wrfcoin-alerts-critical'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '{{ if eq .Status "firing" }}:rotating_light: CRITICAL ALERT{{ else }}:white_check_mark: RESOLVED{{ end }}'
        title_link: '{{ template "slack.default.titlelink" . }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        actions:
          - type: button
            text: 'View in Grafana'
            url: 'http://localhost:3004/d/wrfcoin-overview'
          - type: button
            text: 'Runbook'
            url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
    email_configs:
      - to: 'ops@wrfcoin.com'
        send_resolved: true
        html: |
          <h2>{{ if eq .Status "firing" }}CRITICAL ALERT{{ else }}RESOLVED{{ end }}</h2>
          <table>
          {{ range .Alerts }}
          <tr><td><b>Alert:</b></td><td>{{ .Annotations.summary }}</td></tr>
          <tr><td><b>Description:</b></td><td>{{ .Annotations.description }}</td></tr>
          <tr><td><b>Severity:</b></td><td>{{ .Labels.severity }}</td></tr>
          <tr><td><b>Service:</b></td><td>{{ .Labels.service }}</td></tr>
          {{ end }}
          </table>

  # Slack critical channel
  - name: 'slack-critical'
    slack_configs:
      - channel: '#wrfcoin-alerts'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        title: '{{ if eq .Status "firing" }}:warning: Alert Firing{{ else }}:white_check_mark: Resolved{{ end }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Slack warnings channel
  - name: 'slack-warnings'
    slack_configs:
      - channel: '#wrfcoin-alerts-warnings'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
        title: '{{ if eq .Status "firing" }}:warning: Warning{{ else }}:white_check_mark: Resolved{{ end }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}

  # Infrastructure alerts (Slack)
  - name: 'slack-infrastructure'
    slack_configs:
      - channel: '#wrfcoin-infrastructure'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
        title: 'Infrastructure Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          {{ end }}

  # Security alerts - immediate notification
  - name: 'security-alerts'
    slack_configs:
      - channel: '#wrfcoin-security'
        send_resolved: true
        color: 'danger'
        title: ':shield: Security Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *SECURITY ALERT*
          *Summary:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Labels:* {{ .Labels }}
          {{ end }}
    email_configs:
      - to: 'security@wrfcoin.com'
        send_resolved: true
        headers:
          Priority: 'urgent'
          X-Priority: '1'
        html: |
          <h2 style="color: red;">SECURITY ALERT</h2>
          {{ range .Alerts }}
          <p><b>Alert:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          {{ end }}

  # Email-only alerts
  - name: 'email-alerts'
    email_configs:
      - to: 'ops@wrfcoin.com'
        send_resolved: true
        html: |
          <h3>WRFCoin Alert Notification</h3>
          {{ range .Alerts }}
          <p><b>Alert:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Severity:</b> {{ .Labels.severity }}</p>
          {{ end }}

  # Webhook receiver (for custom integrations)
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

# Inhibit rules - prevent alert storms
inhibit_rules:
  # Don't fire warning if critical is already firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']

  # Don't fire warning if high is already firing
  - source_match:
      severity: 'high'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Cluster-wide inhibition
  - source_match:
      alertname: 'ClusterDown'
    target_match_re:
      alertname: '.*'
    equal: ['cluster']

  # Service-level inhibition
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '(HighLatency|HighErrorRate|.*Degraded)'
    equal: ['service']
