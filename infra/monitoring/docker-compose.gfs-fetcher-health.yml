version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wrfcoin-gfs-health-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # SECURITY: --web.enable-lifecycle removed (unauth /-/reload and /-/quit endpoints)
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus-gfs-fetcher.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules-gfs-fetcher.yml:/etc/prometheus/alert-rules-gfs-fetcher.yml:ro
      - prometheus-gfs-health-data:/prometheus
    depends_on:
      - node-exporter
      - gfs-fetch-health

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: wrfcoin-gfs-health-node-exporter
    command:
      - '--collector.disable-defaults'
      - '--collector.textfile'
      - '--collector.textfile.directory=/etc/node-exporter'
    depends_on:
      gfs-fetch-health-init:
        condition: service_completed_successfully
    ports:
      - '9100:9100'
    volumes:
      - node-exporter-textfiles:/etc/node-exporter

  gfs-fetch-health:
    build:
      context: .
      dockerfile: Dockerfile.gfs-fetch-healthcheck
    container_name: wrfcoin-gfs-fetch-health
    user: "1001:1001"
    depends_on:
      gfs-fetch-health-init:
        condition: service_completed_successfully
    environment:
      - GFS_HEALTH_MODE=${GFS_HEALTH_MODE:-dry-run}
      - GFS_HEALTH_RUN_ONCE=${GFS_HEALTH_RUN_ONCE:-0}
      - GFS_HEALTH_LOOP_INTERVAL_SECONDS=${GFS_HEALTH_LOOP_INTERVAL_SECONDS:-300}
      - GFS_HEALTH_MAX_AGE_SECONDS=${GFS_HEALTH_MAX_AGE_SECONDS:-900}
      - GFS_METRICS_OUTPUT_PATH=/var/lib/node_exporter/textfile_collector/gfs_fetch_health.prom
      - GFS_HEALTH_STATE_DIR=/var/lib/gfs-fetch-health
      - GFS_HEALTH_DRY_RUN_FIXTURE=${GFS_HEALTH_DRY_RUN_FIXTURE:-/app/testdata/gfs-success.grib2.fixture}
      - GFS_ENDPOINT=${GFS_ENDPOINT:-https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl}
      - GFS_TIMEOUT_SECONDS=${GFS_TIMEOUT_SECONDS:-20}
    volumes:
      - node-exporter-textfiles:/var/lib/node_exporter/textfile_collector
      - gfs-fetch-health-state:/var/lib/gfs-fetch-health

  gfs-fetch-health-init:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: wrfcoin-gfs-fetch-health-init
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        chown -R 1001:1001 /var/lib/node_exporter/textfile_collector /var/lib/gfs-fetch-health
        test -w /var/lib/node_exporter/textfile_collector
        test -w /var/lib/gfs-fetch-health
    volumes:
      - node-exporter-textfiles:/var/lib/node_exporter/textfile_collector
      - gfs-fetch-health-state:/var/lib/gfs-fetch-health
    restart: "no"

volumes:
  node-exporter-textfiles:
  gfs-fetch-health-state:
  prometheus-gfs-health-data:
