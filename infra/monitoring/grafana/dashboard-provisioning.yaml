    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure

  # Cross-chain monitoring dashboards
  - name: 'cross-chain-monitoring'
    orgId: 1
    folder: 'Cross-Chain'
    folderUid: 'cross-chain'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/cross-chain

  # Weather and IoT monitoring dashboards
  - name: 'weather-iot-monitoring'
    orgId: 1
    folder: 'Weather & IoT'
    folderUid: 'weather-iot'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/weather-iot

  # Distributed tracing dashboards
  - name: 'tracing-monitoring'
    orgId: 1
    folder: 'Distributed Tracing'
    folderUid: 'tracing'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/tracing

  # SLO/SLI Compliance dashboards
  - name: 'slo-compliance'
    orgId: 1
    folder: 'SLO Compliance'
    folderUid: 'slo-compliance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/slo

  # Performance optimization dashboards
  - name: 'performance'
    orgId: 1
    folder: 'Performance'
    folderUid: 'performance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/performance
