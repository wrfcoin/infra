# Grafana Dashboard Provisioning Configuration
# Automatically provisions dashboards from JSON files

apiVersion: 1

providers:
  # Core Wrfcoin dashboards
  - name: 'wrfcoin-core'
    orgId: 1
    folder: 'Wrfcoin Core'
    folderUid: 'wrfcoin-core'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/core

  # Real-time monitoring dashboards
  - name: 'real-time-monitoring'
    orgId: 1
    folder: 'Real-Time Monitoring'
    folderUid: 'real-time'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/real-time

  # Security monitoring dashboards
  - name: 'security-monitoring'
    orgId: 1
    folder: 'Security & Compliance'
    folderUid: 'security'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/security

  # Infrastructure monitoring dashboards
  - name: 'infrastructure-monitoring'
    orgId: 1
    folder: 'Infrastructure'
    folderUid: 'infrastructure'
    type: file
    disableDeletion: false
