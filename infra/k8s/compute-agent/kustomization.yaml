apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wrfcoin-compute-agent

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - autoscaling.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: wrfcoin-compute-agent
      app.kubernetes.io/part-of: wrfcoin
