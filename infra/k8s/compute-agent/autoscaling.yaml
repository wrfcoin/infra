apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wrfcoin-compute-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wrfcoin-compute-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wrfcoin-compute-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wrfcoin-compute-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 900
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 300
        - type: Pods
          value: 1
          periodSeconds: 300
