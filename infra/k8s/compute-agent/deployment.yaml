apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrfcoin-compute-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wrfcoin-compute-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wrfcoin-compute-agent
        app.kubernetes.io/component: compute-agent
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: wrfcoin-compute-agent
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compute-agent
          image: wrfcoin/compute-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wrfcoin-compute-agent-config
          env:
            - name: WALLET_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: wrfcoin-compute-agent-secrets
                  key: wallet-address
          ports:
            - name: health
              containerPort: 3333
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: health
            failureThreshold: 12
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
