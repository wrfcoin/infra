---
# IPFS API Service (internal)
apiVersion: v1
kind: Service
metadata:
  name: ipfs-api
  namespace: storage
  labels:
    app: ipfs
    component: storage
spec:
  type: ClusterIP
  selector:
    app: ipfs
  ports:
    - name: api
      port: 5001
      targetPort: 5001
      protocol: TCP
---
# IPFS Gateway Service (internal)
apiVersion: v1
kind: Service
metadata:
  name: ipfs-gateway
  namespace: storage
  labels:
    app: ipfs
    component: storage
spec:
  type: ClusterIP
  selector:
    app: ipfs
  ports:
    - name: gateway
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# IPFS Swarm Service (internal)
apiVersion: v1
kind: Service
metadata:
  name: ipfs-swarm
  namespace: storage
  labels:
    app: ipfs
    component: storage
spec:
  type: ClusterIP
  selector:
    app: ipfs
  ports:
    - name: swarm
      port: 4001
      targetPort: 4001
      protocol: TCP
