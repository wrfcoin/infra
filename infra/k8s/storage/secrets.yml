---
# Storage Provider Secrets
# IMPORTANT: Replace placeholder values before deploying.
# In production, use sealed-secrets or external-secrets-operator
# to manage these values securely.
apiVersion: v1
kind: Secret
metadata:
  name: ipfs-secrets
  namespace: storage
  labels:
    app: ipfs
    component: storage
type: Opaque
stringData:
  # IPFS cluster secret — shared across all IPFS nodes
  CLUSTER_SECRET: "REPLACE_WITH_IPFS_CLUSTER_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: filecoin-secrets
  namespace: storage
  labels:
    app: filecoin-lotus
    component: storage
type: Opaque
stringData:
  # Filecoin wallet private key (hex)
  LOTUS_WALLET_KEY: "REPLACE_WITH_FILECOIN_WALLET_KEY"
  # Filecoin API authentication token
  LOTUS_API_TOKEN: "REPLACE_WITH_FILECOIN_API_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: arweave-secrets
  namespace: storage
  labels:
    app: arweave-gateway
    component: storage
type: Opaque
stringData:
  # Arweave wallet JWK (JSON Web Key)
  ARWEAVE_WALLET_KEY: "REPLACE_WITH_ARWEAVE_WALLET_JWK"
