apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wrfcoin-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/websocket-services: 'wrfcoin-api-service'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  tls:
    - hosts:
        - wrfcoin.example.com
      secretName: wrfcoin-tls
  rules:
    - host: wrfcoin.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wrfcoin-api-service
                port:
                  number: 5002
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: wrfcoin-api-service
                port:
                  number: 5002
          - path: /iot
            pathType: Prefix
            backend:
              service:
                name: wrfcoin-iot-service
                port:
                  number: 5006
          - path: /compute
            pathType: Prefix
            backend:
              service:
                name: wrfcoin-compute-service
                port:
                  number: 5003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wrfcoin-frontend-service
                port:
                  number: 80
