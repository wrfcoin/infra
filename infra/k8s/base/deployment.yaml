---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrfcoin-frontend
  labels:
    app: wrfcoin-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wrfcoin-frontend
  template:
    metadata:
      labels:
        app: wrfcoin-frontend
        component: frontend
    spec:
      # SECURITY: Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wrfcoin-frontend
          # SECURITY: Pin to specific version (git SHA)
          image: wrfcoin/frontend:78ba22962
          # SECURITY: Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: 'production'
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          # SECURITY: Volume mounts for writable paths
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

---
# API Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrfcoin-api
  labels:
    app: wrfcoin-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wrfcoin-api
  template:
    metadata:
      labels:
        app: wrfcoin-api
        component: backend
    spec:
      # SECURITY: Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wrfcoin-api
          # SECURITY: Pin to specific version (git SHA)
          image: wrfcoin/backend:78ba22962
          # SECURITY: Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ['node', 'dist/server/enhanced_unified_api_optimized.js']
          ports:
            - containerPort: 4001
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '4001'
            - name: BLOCKCHAIN_NODE_URL
              value: 'http://wrfcoin-blockchain-service:8556'
            - name: CORE4_API_URL
              value: 'http://wrfcoin-blockchain-service:8556'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wrfcoin-secrets
                  key: database-url
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '1Gi'
              cpu: '1000m'
          # SECURITY: Volume mounts for writable paths
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}

