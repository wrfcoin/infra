---
# Blockchain Node Deployment (Rust native-chain)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrfcoin-blockchain
  labels:
    app: wrfcoin-blockchain
    component: blockchain-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrfcoin-blockchain
  template:
    metadata:
      labels:
        app: wrfcoin-blockchain
        component: blockchain-node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wrfcoin-blockchain
          # SECURITY: Pin to specific version (git SHA)
          image: wrfcoin/core4:78ba22962
          securityContext:
            allowPrivilegeEscalation: false
            # readOnlyRootFilesystem omitted: Rust node writes chain data to /data PVC
            capabilities:
              drop:
                - ALL
          # No command override — uses Dockerfile ENTRYPOINT (/usr/local/bin/wrfcoin-node)
          ports:
            - containerPort: 8556
          env:
            - name: WRFCOIN_API_HOST
              value: '0.0.0.0'
            - name: WRFCOIN_API_PORT
              value: '8556'
            - name: RUST_LOG
              value: 'info'
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '2Gi'
              cpu: '2000m'
          volumeMounts:
            - name: chain-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8556
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8556
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: chain-data
          persistentVolumeClaim:
            claimName: wrfcoin-chain-data
        - name: tmp
          emptyDir: {}

---
# PersistentVolumeClaim for blockchain node chain data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wrfcoin-chain-data
  labels:
    app: wrfcoin-blockchain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
