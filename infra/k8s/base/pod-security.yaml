# WRFCoin Pod Security Configuration
# Note: PodSecurityPolicy is deprecated (removed in K8s 1.25+)
# This file uses Pod Security Admission (PSA) labels and SecurityContextConstraints

---
# Namespace with Pod Security Standards enforcement
apiVersion: v1
kind: Namespace
metadata:
  name: wrfcoin-production
  labels:
    # SECURITY: Enforce restricted pod security standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

